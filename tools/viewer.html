<!doctype html>
<html><head><meta charset="utf-8"><title>motion-flow-lab viewer</title>
<style>html,body{margin:0;background:#F4F1EA;overflow:hidden;font-family:system-ui,sans-serif}
#lbl{position:absolute;left:18px;top:14px;font-size:22px;font-weight:700;color:#14213D}
#sub{position:absolute;left:18px;top:44px;font-size:15px;color:#4A5568}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="lbl"></div><div id="sub"></div>
<script type="module">
// Renders one test scene: obstacle, observed point cloud, the sampled end-effector paths and the arm along one path.
// URL parameters: data=<json>, model=<label>, frame=<0..31>, w, h. Sets document.title = "ready" when drawn.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 900), H = +(q.get('h') || 700);
const data = await (await fetch(q.get('data'))).json();
const R = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
R.setSize(W, H); R.setPixelRatio(1); R.setClearColor('#F4F1EA'); R.shadowMap.enabled = true;
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(R.domElement);
const S = new THREE.Scene();
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, -1.2, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -1, right: 1, top: 1, bottom: -1});
S.add(sun, new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 0.6));
const table = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 0.02), new THREE.MeshStandardMaterial({color: 0xE7E1D6, roughness: 0.8}));
table.position.set(0.35, 0, -0.01); table.receiveShadow = true; S.add(table);
const grid = new THREE.GridHelper(1.6, 16, 0xcfc6b5, 0xdcd4c4); grid.rotation.x = Math.PI / 2; grid.position.set(0.35, 0, 0.001); S.add(grid);
const sc = data.scene;
const obs = new THREE.Mesh(new THREE.SphereGeometry(sc.radius, 48, 32),
  new THREE.MeshStandardMaterial({color: 0xE4572E, roughness: 0.45, transparent: true, opacity: 0.55}));
obs.position.set(...sc.center); obs.castShadow = true; S.add(obs);
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(sc.cloud.flat(), 3));
S.add(new THREE.Points(pg, new THREE.PointsMaterial({color: 0x7A1E05, size: 0.012})));
for (const [p, col] of [[sc.start_ee, 0x2B59C3], [sc.goal, 0x2A9D8F]]) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.018, 24, 16), new THREE.MeshStandardMaterial({color: col}));
  m.position.set(...p); S.add(m);
}
const modeColor = {inside: 0x2B59C3, outside: 0xF2A541, fail: 0x9AA5B1};
for (const path of data.paths) {
  const pts = path.ee.map(p => new THREE.Vector3(...p));
  const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, 0.004, 8, false);
  S.add(new THREE.Mesh(tube, new THREE.MeshStandardMaterial({color: modeColor[path.mode], roughness: 0.4,
    transparent: path.mode === 'fail', opacity: path.mode === 'fail' ? 0.6 : 1})));
}
// arm along the highlighted path
const f = Math.min(+(q.get('frame') || data.arm.length - 1), data.arm.length - 1);
const J = data.arm[f].map(p => new THREE.Vector3(...p));
const steel = new THREE.MeshStandardMaterial({color: 0xC9D1D9, metalness: 0.7, roughness: 0.3});
const dark = new THREE.MeshStandardMaterial({color: 0x14213D, metalness: 0.3, roughness: 0.4});
const col = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.30, 32), dark);
col.rotation.x = Math.PI / 2; col.position.set(0, 0, 0.15); col.castShadow = true; S.add(col);
const radii = [0.035, 0.030, 0.025];
for (let i = 0; i < 3; i++) {
  const a = J[i], b = J[i + 1], len = a.distanceTo(b);
  const cap = new THREE.Mesh(new THREE.CapsuleGeometry(radii[i], len, 8, 24), steel);
  cap.position.copy(a.clone().add(b).multiplyScalar(0.5));
  cap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  cap.castShadow = true; S.add(cap);
  const jt = new THREE.Mesh(new THREE.SphereGeometry(radii[i] * 1.25, 24, 16), dark); jt.position.copy(a); S.add(jt);
}
document.getElementById('lbl').textContent = q.get('model') || '';
document.getElementById('sub').textContent = q.get('sub') || '';
const cam = new THREE.PerspectiveCamera(32, W / H, 0.01, 20); cam.up.set(0, 0, 1);
cam.position.set(+(q.get('cx') || 0.5), +(q.get('cy') || -1.4), +(q.get('cz') || 1.9));
cam.lookAt(0.33, 0, 0.18);
R.render(S, cam); document.title = 'ready';
</script></body></html>
